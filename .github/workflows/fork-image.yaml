name: Build fork image

# Builds the Kueue manager image from this fork and pushes it to the public
# Artifact Registry repo that clusters pull from without credentials. Runs on
# every push to main and on demand. Each run pushes one immutable
# v<date>-<sha> tag; there is no floating tag, so a build changes nothing
# until a deployment references it.
#
# Multi-arch: linux/amd64 + linux/arm64 in one buildx build. The Dockerfile
# compiles on the build platform with GOARCH set per target, so no emulation
# is needed.
#
# Auth: workload identity federation through the GitHub pool in sky-prod-465,
# impersonating the gitops service account, the same way the image workflows
# in feature-plugin authenticate. The service account's IAM policy grants
# roles/iam.workloadIdentityUser to this repository's principal set.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (defaults to v<date>-<sha>)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: us-west2-docker.pkg.dev
  # Public-read (allUsers reader).
  IMAGE: us-west2-docker.pkg.dev/sky-prod-465/skypilot-public/kueue
  SERVICE_ACCOUNT: gitops@sky-prod-465.iam.gserviceaccount.com
  PROJECT_NUMBER: 523587443480

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git describe needs the tag history for the version baked into the binary.
          fetch-depth: 0

      # Pass user input via env: rather than interpolating into the shell
      # script (GHA-script-injection).
      - name: Resolve tag and build args
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="v$(date -u +%Y%m%d)-$(git rev-parse --short=8 HEAD)"
          fi
          # Same values the Makefile's image-build target passes.
          GIT_TAG="$(git describe --tags --dirty --always)"
          GIT_COMMIT="$(git rev-parse HEAD)"
          BUILDER_IMAGE="$(grep '^FROM' hack/images/golang/Dockerfile | awk '{print $2}')"
          BASE_IMAGE="$(grep '^FROM' hack/images/distroless/Dockerfile | awk '{print $2}')"
          {
            echo "tag=${TAG}"
            echo "git_tag=${GIT_TAG}"
            echo "git_commit=${GIT_COMMIT}"
            echo "builder_image=${BUILDER_IMAGE}"
            echo "base_image=${BASE_IMAGE}"
          } >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}:${TAG}"
          echo "GitVersion: ${GIT_TAG}"

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: "projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "${{ env.SERVICE_ACCOUNT }}"

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          build-args: |
            BUILDER_IMAGE=${{ steps.vars.outputs.builder_image }}
            BASE_IMAGE=${{ steps.vars.outputs.base_image }}
            CGO_ENABLED=0
            GIT_TAG=${{ steps.vars.outputs.git_tag }}
            GIT_COMMIT=${{ steps.vars.outputs.git_commit }}
          cache-from: type=gha,scope=kueue
          cache-to: type=gha,mode=max,scope=kueue

      - name: Summary
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          GIT_TAG: ${{ steps.vars.outputs.git_tag }}
        run: |
          set -euo pipefail
          {
            echo "## Kueue fork image"
            echo
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- GitVersion: \`${GIT_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
